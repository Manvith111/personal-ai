name: Build Aide APK

# Builds the installable Android app on GitHub's servers every time you push,
# and publishes it as a Release you can download straight onto your phone.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu machines come with the Android SDK preinstalled ($ANDROID_HOME).
      # Make sure its licenses are accepted; the Android Gradle Plugin downloads anything missing.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Android SDK: $ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose their "executable" flag.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests (assistant brain)
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build the APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Aide.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aide-apk
          path: Aide.apk

      - name: Publish a release with the APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aide build ${{ github.run_number }}
          body: Download **Aide.apk** below on your Android phone and open it to install.
          files: Aide.apk
